# =====================================================================================================
# Perfil de produccion. Se activa al arrancar con:  --spring.profiles.active=prod
# (o con la variable de entorno SPRING_PROFILES_ACTIVE=prod). Se suma a application.properties.
# =====================================================================================================

# -----------------------------------------------------------------------------------------------------
# IP real del cliente detras de un proxy (nginx, balanceador, ingress, App Service...)
#
# Sin esto, request.getRemoteAddr() devuelve la IP del proxy para todos los usuarios y el limite de
# registros por IP (FiltroLimitePeticionesRegistro) se convierte en un limite global: con 5 registros
# por minuto entre todos, el resto de usuarios recibiria 429.
#
# Con "native", Tomcat toma la IP de la cabecera X-Forwarded-For, pero SOLO si la peticion llega desde
# un proxy de confianza (internal-proxies). Si no, la ignora: un cliente no puede falsificar su IP
# enviando la cabecera el mismo. No usar "framework": confia en la cabecera venga de donde venga.
#
# Es seguro activarlo aunque no haya proxy: los clientes llegan desde IPs publicas, que no son de
# confianza, y la cabecera se ignora.
# -----------------------------------------------------------------------------------------------------
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

# Proxies de confianza (expresion regular sobre su IP). Por defecto Tomcat confia en las redes privadas
# (10.x, 192.168.x, 172.16-31.x, 127.x, 169.254.x y equivalentes IPv6), que cubre el caso habitual de
# un proxy en la misma red que el backend.
#
# RELLENAR si el proxy tiene una IP publica o si se quiere restringir a un unico proxy concreto.
# Ejemplo para un solo proxy en 10.0.0.5 (los puntos van escapados):
# server.tomcat.remoteip.internal-proxies=10\\.0\\.0\\.5
#
# El proxy debe anadir la cabecera. En nginx:
#   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#
# Comprobacion tras desplegar:
#   1. Seis registros seguidos desde un equipo: el sexto da 429 y a un companero en otra red no le afecta.
#   2. Repetirlo enviando un X-Forwarded-For falso distinto en cada peticion: el sexto debe seguir dando 429.

# -----------------------------------------------------------------------------------------------------
# Correo saliente (recuperacion de contrasena)
#
# Sin valores por defecto a proposito: si falta alguna variable la aplicacion NO arranca, en lugar de enviar por un
# servidor equivocado. Las credenciales van solo en variables de entorno, nunca en este fichero.
# El cifrado por defecto es STARTTLS (puerto 587); para TLS implicito (puerto 465) poner ESIBUY_SMTP_TLS=TLS_IMPLICITO.
# Un servidor remoto sin cifrado o sin credenciales se rechaza al arrancar.
# -----------------------------------------------------------------------------------------------------
esibuy.correo.host=${ESIBUY_SMTP_HOST}
esibuy.correo.puerto=${ESIBUY_SMTP_PUERTO:587}
esibuy.correo.tls=${ESIBUY_SMTP_TLS:STARTTLS}
esibuy.correo.usuario=${ESIBUY_SMTP_USUARIO}
esibuy.correo.contrasena=${ESIBUY_SMTP_CONTRASENA}
esibuy.correo.remitente=${ESIBUY_SMTP_REMITENTE}
esibuy.correo.url-base-frontend=${ESIBUY_URL_FRONTEND}

# -----------------------------------------------------------------------------------------------------
# Segundo factor (2FA): clave de cifrado de los secretos TOTP
#
# Sin valor por defecto a proposito: si falta ESIBUY_2FA_CLAVE la aplicacion NO arranca, en lugar de cifrar con la clave
# de desarrollo, que esta en el repositorio. Es una clave AES-256: 32 bytes aleatorios en Base64 (openssl rand -base64 32).
# Va solo en variable de entorno, separada del pepper. Si se pierde, nadie podra validar su codigo: guardar una copia
# segura. Para rotarla se anade una version nueva y se cambia la version activa; los secretos antiguos se siguen leyendo.
# -----------------------------------------------------------------------------------------------------
esibuy.dosfactores.claves.1=${ESIBUY_2FA_CLAVE}
