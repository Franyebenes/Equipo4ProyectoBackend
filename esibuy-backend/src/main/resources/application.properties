spring.application.name=esibuy-backend

# MongoDB (Spring Boot 4: spring.mongodb.*; spring.data.mongodb.uri ya no se aplica). En produccion, MONGODB_URI.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ESIBuy}

app.cors.allowed-origin=http://localhost:43127
spring.jackson.deserialization.fail-on-unknown-properties=true
esibuy.seguridad.pepper=${ESIBUY_PEPPER:}
esibuy.limite-registro.max-peticiones=5
esibuy.limite-registro.ventana=PT1M
spring.jackson.default-leniency=false

# Catalogo de avatares (identificadores; las imagenes las sirve el frontend en public/avatares/<id>.png)
esibuy.avatares.disponibles=avatar-01,avatar-02,avatar-03,avatar-04,avatar-05,avatar-06,avatar-07,avatar-08
esibuy.avatares.por-defecto-cliente=defecto-cliente
esibuy.avatares.por-defecto-vendedor=defecto-vendedor

# Contrasenas filtradas: consulta a Pwned Passwords (haveibeenpwned.com) ademas de las listas locales.
# Si no responde en el tiempo de espera, se usan solo las listas locales. false = solo listas locales.
esibuy.pwned-passwords.habilitado=true
esibuy.pwned-passwords.url=https://api.pwnedpasswords.com
esibuy.pwned-passwords.tiempo-espera=PT2S

# Cookie de sesion: solo HTTPS, no accesible desde JavaScript, no se envia en peticiones cruzadas salvo navegacion
# (SameSite=Lax), limitada a la API, y la sesion se sigue solo por cookie (nunca por un identificador en la URL).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/api
server.servlet.session.tracking-modes=cookie

# Proxies de confianza (IPs separadas por comas) cuya cabecera X-Forwarded-For se acepta para saber la IP del cliente.
# Vacio = no se fia de ninguna. Ejemplo: esibuy.seguridad.proxies-confiables=10.0.0.1,10.0.0.2
esibuy.seguridad.proxies-confiables=
