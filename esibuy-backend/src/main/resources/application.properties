spring.application.name=esibuy-backend

# MongoDB (Spring Boot 4: spring.mongodb.*; spring.data.mongodb.uri ya no se aplica). En produccion, MONGODB_URI.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ESIBuy}

app.cors.allowed-origin=http://localhost:43127
spring.jackson.deserialization.fail-on-unknown-properties=true
esibuy.seguridad.pepper=${ESIBUY_PEPPER:}
esibuy.limite-registro.max-peticiones=5
esibuy.limite-registro.ventana=PT1M
spring.jackson.default-leniency=false

# Catalogo de avatares (identificadores; las imagenes las sirve el frontend en public/avatares/<id>.png)
esibuy.avatares.disponibles=avatar-01,avatar-02,avatar-03,avatar-04,avatar-05,avatar-06,avatar-07,avatar-08
esibuy.avatares.por-defecto-cliente=defecto-cliente
esibuy.avatares.por-defecto-vendedor=defecto-vendedor

# Contrasenas filtradas: consulta a Pwned Passwords (haveibeenpwned.com) ademas de las listas locales.
# Si no responde en el tiempo de espera, se usan solo las listas locales. false = solo listas locales.
esibuy.pwned-passwords.habilitado=true
esibuy.pwned-passwords.url=https://api.pwnedpasswords.com
esibuy.pwned-passwords.tiempo-espera=PT2S

# Cookie de sesion: solo HTTPS, no accesible desde JavaScript, no se envia en peticiones cruzadas salvo navegacion
# (SameSite=Lax), limitada a la API, y la sesion se sigue solo por cookie (nunca por un identificador en la URL).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.path=/api
server.servlet.session.tracking-modes=cookie

# Proxies de confianza (IPs separadas por comas) cuya cabecera X-Forwarded-For se acepta para saber la IP del cliente.
# Vacio = no se fia de ninguna. Ejemplo: esibuy.seguridad.proxies-confiables=10.0.0.1,10.0.0.2
esibuy.seguridad.proxies-confiables=

# Correo saliente (recuperacion de contrasena). Por defecto: servidor de pruebas local Mailpit, sin cifrado, que solo se
# admite hacia localhost. Arrancarlo con:  docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit
# y ver los correos en http://localhost:8025. En produccion (perfil prod) estos valores se sustituyen por los de un
# SMTP real con cifrado obligatorio.
esibuy.correo.host=localhost
esibuy.correo.puerto=1025
esibuy.correo.tls=NINGUNO
esibuy.correo.remitente=no-reply@esibuy.local
esibuy.correo.url-base-frontend=http://localhost:43127

# Limites de la recuperacion de contrasena (independientes del bloqueo del login). Contadores en memoria de esta instancia.
# Por cuenta: como mucho 5 solicitudes en 24 h (ventana deslizante) y 60 s de espera entre dos solicitudes.
# Por IP: como mucho 10 solicitudes por hora. Al superarlos el cliente recibe la misma respuesta de siempre, sin correo.
esibuy.recuperacion.max-por-cuenta=5
esibuy.recuperacion.ventana-cuenta=PT24H
esibuy.recuperacion.cooldown=PT60S
esibuy.recuperacion.max-por-ip=10
esibuy.recuperacion.ventana-ip=PT1H

# Intentos de restablecer la contrasena con el enlace del correo: como mucho 10 por hora y por IP (ventana deslizante).
# Cada intento cuenta aunque el token sea basura. Al superarlo, 429. Independiente del bloqueo del login.
esibuy.restablecimiento.max-por-ip=10
esibuy.restablecimiento.ventana-ip=PT1H

# Segundo factor (2FA con TOTP, compatible con Google Authenticator).
# claves: claves AES-256 (Base64, 32 bytes) con las que se cifran los secretos TOTP, por version. La de aqui es SOLO
# para desarrollo y pruebas; en produccion (perfil prod) se sustituye por ESIBUY_2FA_CLAVE, sin valor por defecto.
# Generar una clave:  openssl rand -base64 32
# Desafio: el paso intermedio del login (contrasena correcta, codigo pendiente). Fallos y accesos por IP: ventanas
# deslizantes en memoria de esta instancia, independientes del bloqueo del login.
esibuy.dosfactores.emisor=ESIBuy
esibuy.dosfactores.claves.1=9116Yp/BUPNS2NzHlsqNWEPWWjW9TixTzCgPsnk7+yI=
esibuy.dosfactores.version-activa=1
esibuy.dosfactores.caducidad-activacion=PT10M
esibuy.dosfactores.caducidad-desafio=PT5M
esibuy.dosfactores.max-intentos-desafio=5
esibuy.dosfactores.max-fallos-cuenta=10
esibuy.dosfactores.ventana-cuenta=PT15M
esibuy.dosfactores.max-por-ip=30
esibuy.dosfactores.ventana-ip=PT1H
esibuy.dosfactores.codigos-recuperacion=10
